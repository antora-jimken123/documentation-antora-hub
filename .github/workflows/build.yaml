name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: docs-amd64-stable
    defaults:
      run:
        shell: sh
    container:
      image: antora/antora:3.1.4
    steps:
    - uses: actions/checkout@v3
    - name: Install deps
      run: |
        apk add bash make
        npm install
    - run: make docs
    - run: |
        ls -l build/*
