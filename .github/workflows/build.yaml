name: Build

on:
  push:
    branches:
    - master
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
    container:
      image: antora/antora:3.1.4
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node/NPM
      uses: actions/setup-node@v3
      with:
        cache: 'npm'
    
    - name: Install deps
      run: npm install

    - name: Build the website using make
      run: |
        sed -i s/\$GITHUB_TOKEN/$GITHUB_TOKEN/ antora-playbook.yml
        npx antora generate antora-playbook.yml --stacktrace
      env:
        GITHUB_TOKEN: ${{ secrets.MIDOJENKINS_ALLREPO_RW }}

    - name: Login GHCR
      uses: docker/login-action@v2
      with:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io
    
    
    - name: Docker build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/${{ github.repository }}:latest
