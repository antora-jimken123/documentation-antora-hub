name: Build

on:
  push:
    branches:
    - master
  pull_request:
    paths:
      - ".github/**"
      - "lib/**"
      - "start-page/**"
      - "supplemental_ui/**"
      - "ui-bundle/**"
      - "antora-playbook.yaml"
      - "Dockerfile"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node/NPM
      uses: actions/setup-node@v3
      with:
        cache: 'npm'
    
    - name: Install deps and fetch version from package.json
      id: npmversion
      run: |
        npm install
        VERSION=$(npm pkg get version)
        echo "VERSION=${VERSION}"" | tr -d '"' >> $GITHUB_OUTPUT

    - name: Build the website using make
      run: make docs
      env:
        GITHUB_TOKEN: ${{ secrets.MIDOJENKINS_ALLREPO_RW }}

    - name: Login GHCR
      uses: docker/login-action@v2
      with:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io
    
    
    - name: Docker build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/${{ github.repository }}:${{ steps.npmversion.outputs.VERSION }}
