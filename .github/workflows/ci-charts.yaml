name: Lint and Test Charts

on:
  pull_request:
    paths:
      - "charts/**"

jobs:

  # Lints Chart.yml
  lint-chart:
    name: Lint Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            src:
              - 'charts/**/Chart.yaml'
      - uses: actions/setup-python@v4
        if: steps.changes.outputs.infra == 'true'
        with:
          python-version: 3.9
      - name: Set up chart-testing
        if: steps.changes.outputs.src == 'true'
        uses: helm/chart-testing-action@v2.4.0
      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --config .github/ct.yaml

  # Validates Helm Docs are properly generated
  lint-docs:
    name: Lint Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install helm-docs
        uses: envoy/install-helm-docs@v1.0.0
        with:
            version: 1.11.0
      - name: Run helm-docs
        run: helm-docs && git diff --exit-code

  # Validates the schema of all the templates with k8s resources and CRDs
  kubeconform-chart:
    name: KubeConform Chart
    runs-on: ubuntu-latest
    strategy:
      matrix:
        k8s:
          # Which k8s versions to test against
          - "1.25.4"
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          #  version: '<version>' # default is latest (stable)
           token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install KubeConform plugin
        run: helm plugin install https://github.com/jtyr/kubeconform-helm
      - name: Run KubeConform
        run: ./.github/kubeconform.sh
          
      

