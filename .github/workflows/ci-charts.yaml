name: Lint and Test Charts

on:
  pull_request:
    paths:
      - "charts/**"

jobs:

  lint-chart:
    name: Lint Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: 3.7
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.3.1
      - name: Run chart-testing (lint)
        run: ct lint --config .github/ct.yaml

  lint-docs:
    name: Lint Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install helm-docs
        uses: envoy/install-helm-docs@v1.0.0
        with:
            version: 1.11.0
      - name: Run helm-docs
        run: helm-docs && git diff --exit-code

  kubeconform-chart:
    name: KubeConform Chart
    runs-on: ubuntu-latest
    strategy:
      matrix:
        k8s:
          # Which k8s versions to test against
          - "1.25.4"
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Generate and validate releases
        uses: docker://ghcr.io/shivjm/helm-kubeconform-action:v0.2.0
        with:
          strict: true
          additionalSchemaPaths: |
            'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          chartsDirectory: "./charts"
          kubernetesVersion: ${{ matrix.k8s }}
        env:
          HELM_UPDATE_DEPENDENCIES: "true"

