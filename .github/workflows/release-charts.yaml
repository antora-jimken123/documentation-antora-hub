name: Release Charts

on: 
  workflow_dispatch:
    inputs:
      tag:
        description: 'Helm Chart tag to Release'  
        required: true

jobs:
  release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Helm Dependency Update
      #   run: helm dependency update XXXXXX
    
      - name: Chart | Push
        uses: appany/helm-oci-chart-releaser@v0.3.0
        with:
          name: mido-docs
          repository: midokura/charts
          tag: ${{ github.event.inputs.tag }}
          path: mido-docs
          registry: ghcr.io
          registry_username: ${{ secrets.GHCR_USERNAME_RW }}
          registry_password: ${{ secrets.GHCR_PASSWORD_RW }}
