# Default values for docs.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/midokura/documentation-antora-hub
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: 
- name: foobar
nameOverride: ""
fullnameOverride: ""

# -- Configures automatic image upgrades via flux image update
# This opens new PRs whenever a new docker image or helm chart is detected to update Flux definitions
updateAutomation:
  # -- Enable automation for HelmChart versions
  helm:
    enabled: true
    semverRange: "5.x.x"
    chartRepository: "foo-bar-chart-repo"
  # -- Enable automation for Docker image versions
  # SemverRange is disabled as the chart enforces its own already
  docker:
    enabled: true
    semverRange: "5.x.x"
  # -- Flux Repository resource reference to use to create a PR
  fluxRepository:
    # -- Reference to a GitRepository to where PRs with changes will be opened
    gitRepository: "https://github.com/midokura/flux-platform"
    checkInterval: "10m"
    path: ".cluster/my-env"


serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
   - secretName: chart-example-tls
     hosts:
       - chart-example.local

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
