{{- if .Values.updateAutomation.docker.enabled }}
# Opens a PR in a Flux Git repository whenever a new image is detected by the scanner
apiVersion: image.toolkit.fluxcd.io/v1beta1
kind: ImageUpdateAutomation
metadata:
  name: {{ include "docs.fullname" . }}-docker
  labels:
    {{- include "docs.labels" . | nindent 4 }}
spec:
  interval: {{ .Values.updateAutomation.fluxRepository.checkInterval }}
  sourceRef:
    kind: GitRepository
    name: {{ .Value.updateAutomation.fluxRepository.gitRepositoryRef }}
    namespace: flux-system
  update:
    path: {{ .Values.updateAutomation.fluxRepository.path }}
    strategy: Setters
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
          {{`Automated Docker image update

          Automation name: {{ .AutomationObject }}

          Files:
          {{ range $filename, $_ := .Updated.Files -}}
          - {{ $filename }}
          {{ end -}}

          Objects:
          {{ range $resource, $_ := .Updated.Objects -}}
          - {{ $resource.Kind }} {{ $resource.Name }}
          {{ end -}}

          Images:
          {{ range .Updated.Images -}}
          - {{.}}
          {{ end -}} 
          `}}
    push:
      branch: flux-image-updates
{{- end }}