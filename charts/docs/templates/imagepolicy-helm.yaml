{{- if .Values.updateAutomation.helm.enabled }}
# Checks for image updates in a remote repository given a semver range
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: {{ include "docs.fullname" . }}-helm
  labels:
    {{- include "docs.labels" . | nindent 4 }}
spec:
  imageRepositoryRef:
    name: {{ include "docs.fullname" . }}-helm
    namespace: {{ .Release.Namespace }}
  policy:
    semver:
      range: {{ .Values.updateAutomation.semverRange }}
{{- end }}