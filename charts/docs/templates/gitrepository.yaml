apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: {{ include "docs.fullname" . }}
  labels:
    {{- include "docs.labels" . | nindent 4 }}
spec:
  interval: 1m0s
  timeout: 60s
  url: {{ .Values.updateAutomation.fluxRepository.gitRepository }}
  ref:
    branch: master
  {{- with (first .Values.imagePullSecrets) }}
  secretRef:
    name: {{ .name }}
  {{- end }}