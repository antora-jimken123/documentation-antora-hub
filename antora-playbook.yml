---
antora:
  extensions:
    - require: '@antora/lunr-extension'
      index_latest_only: true
git:
  fetch_concurrency: 1
runtime:
  # Set a local antora cache dir for git repositories and UI components
  cache_dir: ./.cache/antora
  fetch: true
site:
  title: Docs
  # the 404 page and sitemap files only get generated when the url property is set
  url: https://test.docs.midokura.com
  start_page: start-page::index.adoc
  robots: disallow
content:
  edit_url: ~
  sources:
  # Generic start page
  - url: https://github.com/midokura/documentation-antora-hub.git
    start_path: start-page
    branches: HEAD
  - url: https://github.com/midokura/documentation-hc.git
    start_path: docs
    branches:
      - 1111
      - 2222
  - url: https://github.com/midokura/documentation-hc-private.git
    start_path: docs
    branches:
      - 4444
  - url: https://github.com/midokura/documentation-prismatic.git
    start_path: docs
    branches:
      - 3
      - 2
ui:
  bundle:
    url: ./ui-bundle/3.0/ui-bundle.zip
    snapshot: true
asciidoc:
  attributes:
    experimental: true
    stem: latexmath
    idprefix: ''
    idseparator: '-'
    page-pagination: ''
    source-language: asciidoc@
    distribution: 'Horizon'
    tabs: tabs
  extensions:
    - ./lib/tabs-block.js
output:
  clean: true
  dir: ./public
  destinations:
  - provider: fs
  - provider: archive
