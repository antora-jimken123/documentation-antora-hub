---
antora:
  extensions:
    - require: '@antora/lunr-extension'
      index_latest_only: true
git:
  fetch_concurrency: 1
runtime:
  # Set a local antora cache dir for git repositories and UI components
  cache_dir: ./.cache/antora
  fetch: true
site:
  title: Midokura Documentation
  # the 404 page and sitemap files only get generated when the url property is set
  url: https://docs.midokura.com
  start_page: start-page::index.adoc
  robots: disallow
content:
  edit_url: ~
  sources:
  # Generic start page
  - url: https://github.com/midokura/documentation-opennms.git
    start_path: start-page
    branches: HEAD
  - url: https://github.com/opennms/grafana-plugin.git
    start_path: docs
    branches:
      - 'main-*'
      - '!main-7'
  - url: https://github.com/midokura/documentation-ASCII1.git
    start_path: docs
    branches:
      - 2.0
      - 3.0
  - url: https://github.com/OpenNMS/opennms-velocloud-plugin.git
    start_path: docs
    branches:
      - main
      - /^release-.*/
    tags:
      - v*
      - '!v1.0.0'
  - url: https://github.com/midokura/documentation-hc.git
    start_path: docs
    branches:
      - 2.0
      - 3.0
  - url: https://github.com/OpenNMS/opennms-provisioning-integration-server.git
    start_path: docs
    branches:
      - release-*
      - '!release-1.1*'
      - '!release-1.0*'
ui:
  bundle:
    url: https://github.com/midokura/documentation-antora-ui/releases/download/2.0/ui-bundle.zip
    snapshot: true
asciidoc:
  attributes:
    experimental: true
    stem: latexmath
    idprefix: ''
    idseparator: '-'
    page-pagination: ''
    source-language: asciidoc@
    distribution: 'Horizon'
    tabs: tabs
  extensions:
    - ./lib/tabs-block.js
output:
  clean: true
  dir: ./public
  destinations:
  - provider: fs
  - provider: archive
